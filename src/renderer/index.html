        <input type="text" id="search-input" placeholder="Search" />
        <input type="text" id="replace-input" placeholder="Replace" />
        <button id="btn-search-prev" title="Previous">↑</button>
        <button id="btn-search-next" title="Next">↓</button>
        <button id="btn-replace-one">Replace</button>
        <button id="btn-replace-all">Replace All</button>
        <button id="btn-close-search">×</button>
      </div>
      <div id="editor-container" class="editor-container">
        <div id="welcome-screen" class="welcome-screen"></div>
        <div id="settings-view" class="settings-view hidden" role="main" aria-label="Settings"></div>
        <div id="editor-split-root" class="editor-split-root">
          <div id="monaco-host" class="monaco-pane monaco-pane-primary hidden"></div>
          <div id="editor-split-divider" class="editor-split-divider hidden" aria-hidden="true"></div>
          <div id="monaco-host-secondary" class="monaco-pane monaco-pane-secondary hidden"></div>
        </div>
      </div>
      <div id="terminal-resizer" class="terminal-resizer hidden" aria-hidden="true"></div>
      <div id="terminal-panel" class="terminal-panel hidden">
        <div class="panel-header panel-header-terminal">
          <div class="terminal-view-tabs" role="tablist" aria-label="Panel views">
            <button type="button" class="terminal-view-tab" id="tab-problems" data-terminal-view="problems" aria-selected="false" tabindex="-1">PROBLEMS</button>
            <button type="button" class="terminal-view-tab" data-terminal-view="output" aria-selected="false" tabindex="-1">OUTPUT</button>
            <button type="button" id="terminal-tab-label" class="terminal-view-tab active" data-terminal-view="terminal" role="tab" aria-selected="true">TERMINAL</button>
            <button type="button" class="terminal-view-tab" data-terminal-view="debug" aria-selected="false" tabindex="-1">DEBUG CONSOLE</button>
          </div>
          <div id="terminal-instance-tabs-wrapper" class="terminal-instance-tabs-wrapper">
            <div id="terminal-instance-tabs" class="terminal-instance-tabs"></div>
          </div>
          <div class="panel-header-actions">
            <div class="terminal-new-group">
              <button class="icon-btn" id="btn-new-terminal" title="New Terminal (Default Shell)">
                <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 2a.75.75 0 01.75.75v4.5h4.5a.75.75 0 010 1.5h-4.5v4.5a.75.75 0 01-1.5 0v-4.5h-4.5a.75.75 0 010-1.5h4.5v-4.5A.75.75 0 018 2z"/></svg>
              </button>
              <button class="icon-btn icon-btn-dropdown" id="btn-terminal-shell-menu" title="Select Default Shell">
                <svg viewBox="0 0 16 16" width="10" height="10"><path fill="currentColor" d="M4.427 6.427l3.396 3.396a.25.25 0 00.354 0l3.396-3.396A.25.25 0 0011.396 6H4.604a.25.25 0 00-.177.427z"/></svg>
              </button>
              <div id="terminal-shell-dropdown" class="terminal-shell-dropdown hidden"></div>
            </div>
            <button class="icon-btn" id="btn-terminal-clear" title="Clear Terminal (Ctrl+L)">
              <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M3.72 3.72a.75.75 0 011.06 0L8 6.94l3.22-3.22a.75.75 0 111.06 1.06L9.06 8l3.22 3.22a.75.75 0 11-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 01-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 010-1.06z"/></svg>
            </button>
            <button class="icon-btn" id="btn-terminal-kill" title="Kill Terminal Session">
              <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M11 1.75V3h2.25a.75.75 0 010 1.5H2.75a.75.75 0 010-1.5H5V1.75C5 .784 5.784 0 6.75 0h2.5C10.216 0 11 .784 11 1.75zM6.5 1.5h3a.25.25 0 00-.25-.25h-2.5a.25.25 0 00-.25.25zm5.75 4h-8.5l.628 8.796A1.75 1.75 0 006.12 16h3.76a1.75 1.75 0 001.742-1.704l.628-8.796z"/></svg>
            </button>
            <button class="icon-btn" id="btn-terminal-maximize" title="Toggle Maximize Panel">
              <svg id="icon-terminal-max" viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M2.5 2.5h4v1.5h-2.5v2.5h-1.5v-4zm7 0h4v4h-1.5v-2.5h-2.5v-1.5zm-7 7h1.5v2.5h2.5v1.5h-4v-4zm11 0v4h-4v-1.5h2.5v-2.5h1.5z"/></svg>
            </button>
            <button class="icon-btn" id="btn-toggle-terminal" title="Close Panel">
              <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M3.72 3.72a.75.75 0 011.06 0L8 6.94l3.22-3.22a.75.75 0 111.06 1.06L9.06 8l3.22 3.22a.75.75 0 11-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 01-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 010-1.06z"/></svg>
            </button>
          </div>
        </div>
        <div id="problems-container" class="terminal-view-content hidden"></div>
        <div id="debug-console" class="terminal-view-content hidden">
          <div id="debug-console-logs"></div>
          <div class="debug-eval-row">
            <span class="debug-eval-prefix">&gt;</span>
            <input type="text" id="debug-eval-input" placeholder="Evaluate expression…" spellcheck="false" autocomplete="off" />
            <button type="button" class="debug-eval-btn" id="btn-debug-eval">Eval</button>
          </div>
        </div>
        <div id="terminal-placeholder" class="terminal-placeholder hidden" role="region" aria-live="polite"></div>
        <div id="terminal-container" class="terminal-view-content terminal-container"></div>
      </div>
    </main>
    <aside id="sidebar-secondary" class="sidebar sidebar-secondary">
      <div class="sidebar-header">
        <span>SECONDARY SIDE BAR</span>
      </div>
      <div class="sidebar-content"></div>
    </aside>
  </div>

  <footer id="statusbar" class="statusbar">
    <button type="button" id="status-terminal" class="statusbar-btn" title="Toggle terminal">Terminal</button>
    <button type="button" id="status-trust" class="statusbar-btn" title="Manage Workspace Trust" style="display:none;"></button>
    <span id="status-branch">● NexCode</span>
    <span id="status-cwd" class="status-cwd" title="Terminal directory"></span>
    <span id="status-file"></span>
    <span class="status-spacer"></span>
    <span id="status-position">Ln 1, Col 1</span>
    <span id="status-language">Plain Text</span>
    <span id="status-indent">Spaces: 2</span>
    <span id="status-theme">Dark</span>
  </footer>

  <menu id="context-menu" class="context-menu hidden"></menu>

  <!-- Command Palette overlay -->
  <div id="command-palette" class="command-palette hidden" role="dialog" aria-modal="true" aria-label="Command Palette">
    <div class="command-palette-box">
      <div class="command-palette-input-row">
        <span class="command-palette-prefix">&#x276F;</span>
        <input type="text" id="command-palette-input" placeholder="Type a command…" spellcheck="false" autocomplete="off" aria-label="Command search" />
      </div>
      <div id="command-palette-list" role="listbox"></div>
    </div>
  </div>

  <script type="module" src="./app.ts"></script>
</body>
</html>
